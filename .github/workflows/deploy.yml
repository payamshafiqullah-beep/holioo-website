name: Deploy website + Holioo PWA to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Holioo PWA JavaScript
        run: |
          node --check pwa/db.js
          node --check pwa/drive.js
          node --check pwa/core.js
          node --check pwa/courses.js
          node --check pwa/capture.js
          node --check pwa/pdf.js
          node --check pwa/community.js
          node --check pwa/app.js
          node pwa/smoke-test.mjs

      - name: Install website dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Add Holioo installable app
        run: |
          mkdir -p dist/app
          cp -R pwa/. dist/app/
          rm -f dist/app/smoke-test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
