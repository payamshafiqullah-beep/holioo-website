<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#506BFF" />
  <meta name="description" content="Holioo — capturez vos cours, organisez CM/TD/TP, créez des PDF et partagez du matériel académique." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Holioo" />
  <title>Holioo — Études</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="offlineBanner" class="offline-banner hidden">Mode hors ligne — vos captures restent sur cet iPhone.</div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="installSheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <h2>Installer Holioo sur l’iPhone</h2>
      <p>Dans Safari : touchez <strong>Partager</strong> puis <strong>Sur l’écran d’accueil</strong>, puis <strong>Ajouter</strong>.</p>
      <button class="btn primary" id="nativeInstallBtn" hidden>Installer maintenant</button>
      <button class="btn ghost" data-close-sheet>Fermer</button>
    </div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Accueil Holioo">
        <span class="brand-mark">H</span><span>Holioo</span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="installBtn" aria-label="Installer Holioo">⇩</button>
        <button class="avatar" data-nav="profile" id="avatarBtn">H</button>
      </div>
    </header>

    <main id="app" class="main"></main>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>Accueil</small></button>
      <button data-nav="courses" class="nav-item"><span>▤</span><small>Cours</small></button>
      <button data-nav="capture" class="nav-item capture-nav"><span>●</span><small>Capturer</small></button>
      <button data-nav="library" class="nav-item"><span>◫</span><small>Bibliothèque</small></button>
      <button data-nav="files" class="nav-item"><span>▱</span><small>Fichiers</small></button>
    </nav>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
