name: Deploy website + Holioo PWA to GitHub Pages

# main: check, build, publish, then verify the live site.
# Pull requests: the same checks and build, without publishing — a broken change is caught before merging.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Test-only libraries (OpenCV.js, pdf-lib, jsQR…) are dev dependencies: installed first.
      - name: Install dependencies
        run: npm ci

      - name: Verify Holioo PWA JavaScript
        run: |
          node tools/check-syntax.mjs
          node pwa/smoke-test.mjs
          npm test

      - name: Build website
        run: npm run build

      - name: Add Holioo installable app
        run: |
          mkdir -p dist/app
          cp -R pwa/. dist/app/
          # Checks and tests are not part of the published app.
          rm -rf dist/app/smoke-test.mjs dist/app/tests

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify deployed Holioo app
        run: |
          set -e
          ROOT="https://www.holioo.fr/"
          curl -fsSL "$ROOT" -o /tmp/root.html
          grep -q 'href="/app/"' /tmp/root.html
          curl -fsSL "${ROOT}confidentialite.html" | grep -q 'Limited Use'
          curl -fsSL "${ROOT}conditions.html" | grep -q 'Conditions d'
          URL="${ROOT}app/"
          # The exact release that was just built must be the one served (the CDN can take a few minutes).
          RELEASE=$(grep -o 'core.js?v=[^"]*' pwa/index.html | head -1 | cut -d= -f2)
          SW_VERSION=$(grep -o "const VERSION='[^']*'" pwa/sw.js)
          echo "Expecting release $RELEASE ($SW_VERSION)"
          for i in $(seq 1 20); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL?check=$i" -o /tmp/holioo.html && grep -q "$RELEASE" /tmp/holioo.html; then break; fi
            sleep 15
          done
          grep -q "$RELEASE" /tmp/holioo.html
          grep -q 'drive.js' /tmp/holioo.html
          grep -q 'features/camera/CapturePage.js' /tmp/holioo.html
          grep -q 'manifest.webmanifest' /tmp/holioo.html
          curl -fsSL -H 'Cache-Control: no-cache' "${URL}sw.js?check=1" | grep -q "$SW_VERSION"
          curl -fsSL "${URL}features/photos/thumbs.js?v=$RELEASE" -o /dev/null
          curl -fsSL "${URL}manifest.webmanifest" | grep -q '"display": "standalone"'
          if curl -fs -o /dev/null "${URL}tests/camera-destination.test.mjs"; then echo "Test files must not be published"; exit 1; fi
          echo "Holioo live PWA verification: PASS ($RELEASE)"

      - name: Report Google Drive OAuth readiness
        run: |
          echo "Google Drive config status:"
          curl -fsSL "https://vznsvcotzurgmkmtvapm.supabase.co/functions/v1/drive-config-status" || true
          echo
